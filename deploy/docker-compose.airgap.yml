# ============================================================================
# SOC-OPS-DB — AIR-GAPPED production stack.
# Runs entirely from images pre-loaded with `docker load`. No build section,
# no registry pulls, no host source tree required. The only host files needed
# on the target are this compose file and a populated `.env`.
# ============================================================================
services:
  postgres:
    image: postgres:15-alpine
    container_name: cybersec-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cybersec}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-cybersec_dashboard}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersec} -d ${POSTGRES_DB:-cybersec_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network
    restart: unless-stopped

  backend:
    image: soc-ops-db/backend:${APP_VERSION:-1.0}
    container_name: cybersec-api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cybersec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-cybersec_dashboard}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env, generate with openssl rand -hex 32}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}"
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME must be set in .env}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set in .env}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cybersec-network
    restart: unless-stopped
    command: >
      sh -c "
      python init_prod_db.py &&
      uvicorn fastapi_backend:app --host 0.0.0.0 --port 8000
      "

  frontend:
    image: soc-ops-db/frontend:${APP_VERSION:-1.0}
    container_name: cybersec-ui
    ports:
      - "80:80"
      # For HTTPS: add "443:443" here, bake certs into the image or mount them,
      # and add a TLS server block to frontend/nginx.conf before building.
    depends_on:
      - backend
    networks:
      - cybersec-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cybersec-network:
    driver: bridge
