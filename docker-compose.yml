services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cybersec-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cybersec}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-cybersec_dashboard}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersec} -d ${POSTGRES_DB:-cybersec_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cybersec-network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybersec-api
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cybersec}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-cybersec_dashboard}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in .env, generate with openssl rand -hex 32}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}"
      # Bootstrap super-admin — created on first init only. No demo defaults.
      SUPER_ADMIN_USERNAME: "${SUPER_ADMIN_USERNAME:?SUPER_ADMIN_USERNAME must be set in .env}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set in .env}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set in .env}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cybersec-network
    restart: unless-stopped
    command: >
      sh -c "
      python init_prod_db.py &&
      uvicorn fastapi_backend:app --host 0.0.0.0 --port 8000
      "

  # React Frontend (built and served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: cybersec-ui
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/ssl:/etc/nginx/ssl
    networks:
      - cybersec-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cybersec-network:
    driver: bridge
